apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopease
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopease
  template:
    metadata:
      labels:
        app: shopease
    spec:
      containers:
        - name: shopease
          image: krishna249/shopease-backend:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
